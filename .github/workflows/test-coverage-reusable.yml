name: Test Coverage Reusable

on:
  workflow_call:
    inputs:
      modules:
        required: true
        type: string
      go-version:
        required: true
        type: string
      gist-id:
        required: true
        type: string
    secrets:
      GIST_SECRET:
        required: true

jobs:
  coverage:
    name: Run tests and update badge
    runs-on: ubuntu-latest

    env:
      COVERAGE_DIR: coverage
      COVERAGE_FILE: total.out

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4.2.2

      - name: 🧰 Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: 📌 Install Task
        uses: arduino/setup-task@v2.0.0

      - name: 🧪 Run tests with coverage
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          task test-coverage

      - name: 📊 Extract coverage percent
        id: coverage
        shell: bash
        run: |
          COVERAGE_FILE_PATH="${COVERAGE_DIR}/${COVERAGE_FILE}"

          echo "Coverage file: ${COVERAGE_FILE_PATH}"

          if [[ ! -f "$COVERAGE_FILE_PATH" ]]; then
            echo "❌ Coverage file not found: $COVERAGE_FILE_PATH"
            exit 1
          fi

          echo "📄 Coverage file:"
          cat "$COVERAGE_FILE_PATH"

          COVERAGE_OUTPUT=$(go tool cover -func="$COVERAGE_FILE_PATH")

          echo "📊 go tool cover output:"
          echo "$COVERAGE_OUTPUT"

          TOTAL_COVERAGE=$(echo "$COVERAGE_OUTPUT" | awk '/^total:/ {print $NF}')

          if [[ -z "$TOTAL_COVERAGE" ]]; then
            echo "❌ Failed to extract total coverage"
            exit 1
          fi

          echo "💯 Total coverage: $TOTAL_COVERAGE"

          echo "total=$TOTAL_COVERAGE" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Update Gist Badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ inputs.gist-id }}
          filename: coverage.json
          label: Coverage
          message: ${{ steps.coverage.outputs.total }}
          color: green