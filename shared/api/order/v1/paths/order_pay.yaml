parameters:
  - $ref: ../params/order_uuid.yaml

post:
  tags:
    - Order
  summary: Оплатить заказ
  operationId: PayOrder
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/pay_order_request.yaml
  responses:
    '200':
      description: Заказ успешно оплачен
      content:
        application/json:
          schema:
            $ref: ../components/pay_order_response.yaml
    '404':
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: ../components/errors/not_found_error.yaml
    '409':
      description: Заказ уже оплачен или отменён — оплата невозможна
      content:
        application/json:
          schema:
            $ref: ../components/errors/conflict_error.yaml
    '502':
      description: PaymentService недоступен либо вернул ошибку
      content:
        application/json:
          schema:
            $ref: ../components/errors/bad_gateway_error.yaml
    '500':
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: ../components/errors/internal_server_error.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/errors/generic_error.yaml 